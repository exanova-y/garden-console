name = "peacesign"
main = "src/server/worker.ts"
compatibility_date = "2026-07-25"
compatibility_flags = ["nodejs_compat"]

[assets]
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[observability]
enabled = true
head_sampling_rate = 0.1

# Required secrets (set via `wrangler secret put <NAME>` once 1Password CLI or
# the Cloudflare dashboard is available):
#   JWT_SECRET       — random >= 32 chars
#   ALLOWED_ORIGIN   — e.g. https://peacesign.adiabatic.garden
#   ADMIN_USERNAME   — optional
#   ADMIN_PASSWORD   — optional, set together with ADMIN_USERNAME
#   CONNECTOR_ENCRYPTION_KEY — random >= 32 chars, encrypts OAuth tokens in D1
#   GOOGLE_CLIENT_SECRET
#   FEEDLY_CLIENT_SECRET

# Custom domain on the adiabatic.garden Cloudflare zone (replaces Vercel).
[[routes]]
pattern = "peacesign.adiabatic.garden"
custom_domain = true

[[d1_databases]]
binding = "DB"
database_name = "garden-console"
database_id = "897a7c23-9ddb-496e-b11e-b14376b17072"
migrations_dir = "migrations"
